<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Brandev Inspector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .title-box h1 {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.2px;
    }
    .version {
      font-size: 11px;
      color: #64748b;
    }
    .card {
      margin-top: 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .status-label {
      font-size: 12px;
      color: #94a3b8;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .status-online .dot {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .status-offline .dot {
      background: #ef4444;
    }
    .info-list {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
    }
    .info-item span:last-child {
      color: #e2e8f0;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      margin-top: 10px;
      border: none;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
    }
    .btn-outline:hover {
      background: #334155;
      color: white;
    }
    .btn-danger-outline {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      margin-top: 6px;
    }
    .btn-danger-outline:hover {
      background: rgba(239, 68, 68, 0.15);
    }
    .help-box {
      margin-top: 12px;
      background: #0f172a;
      border: 1px dashed #334155;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .help-box strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon48.png" alt="Brandev" class="logo">
    <div class="title-box">
      <h1>Brandev Inspector</h1>
      <span class="version">v1.1.0 • Antigravity IDE</span>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span class="status-label">Servidor Sidecar:</span>
      <span id="statusBadge" class="status-badge status-offline">
        <span class="dot"></span>
        <span id="statusText">Verificando...</span>
      </span>
    </div>

    <div class="info-list" id="infoList" style="display: none;">
      <div class="info-item">
        <span>Porta Local:</span>
        <span>39999</span>
      </div>
      <div class="info-item">
        <span>Projetos detectados:</span>
        <span id="projectsCount">0</span>
      </div>
    </div>

    <!-- Ações se Online -->
    <div id="actionsOnline" style="display: none;">
      <button id="btnDashboard" class="btn btn-outline">
        🌐 Abrir Dashboard
      </button>
      <button id="btnStop" class="btn btn-danger-outline">
        ⏹ Parar Sidecar
      </button>
    </div>

    <!-- Ações se Offline -->
    <div id="actionsOffline">
      <button id="btnStart" class="btn btn-primary">
        ▶ Iniciar Sidecar
      </button>
    </div>
  </div>

  <div class="help-box">
    💡 Segure <strong>Alt</strong> e clique em qualquer botão ou texto no seu site local para abrir a linha exata no <strong>Antigravity IDE</strong>.
  </div>

  <script src="popup.js"></script>
</body>
</html>
